# Hakem model (protokol §6.2). İstem ve bu dosya nihai koşumdan önce hash'leriyle dondurulur (§7.2).
name: hakem_opus
protocol_version: "1.2"
judge:
  api: anthropic
  model: claude-opus-5-5
  # Örnekleme parametresi kabul edilmez; derinliği effort belirler ve açıkça sabitlenir.
  # Geçici değer: effort ve çıktı üst sınırı dev üzerinde seçilecek (hakem_istemi.md, açık noktalar).
  effort: medium
  max_output_tokens: 16000   # düşünme de bu sınıra dahildir
  prompt_file: eval/judge/hakem_istemi.md
  exemption_file: safety/destek_programi_istisnalari.md
